name: bca_department_management

description: BCA Department Management App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  cloud_functions: ^6.0.0

  image_picker: ^1.2.0
  file_picker: ^10.3.2
  url_launcher: ^6.3.2

  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: 12.0.2
  file_saver: ^0.4.0
  pdf: ^3.11.3
  local_auth: ^2.3.0
  syncfusion_flutter_pdfviewer: ^33.2.13
  http: ^1.6.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/excel/attendance_template.xlsx