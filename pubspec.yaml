name: bca_department_management

description: BCA Department Management App

publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ============================================================
  # BASIC
  # ============================================================

  cupertino_icons: ^1.0.8

  # ============================================================
  # FIREBASE
  # ============================================================

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  cloud_functions: ^6.0.0

  # ============================================================
  # IMAGE / FILE PICKER
  # ============================================================

  image_picker: ^1.2.0
  file_picker: ^10.3.2

  # ============================================================
  # URL
  # ============================================================

  url_launcher: ^6.3.2

  # ============================================================
  # QR CODE
  # ============================================================

  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # ============================================================
  # EXCEL
  # ============================================================

  excel: ^4.0.6

  # ============================================================
  # STORAGE / FILES
  # ============================================================

  path_provider: ^2.1.6
  share_plus: ^12.0.2
  file_saver: ^0.4.0

  # ============================================================
  # PDF
  # ============================================================

  pdf: ^3.11.3
  syncfusion_flutter_pdfviewer: ^33.2.13

  # ============================================================
  # AUTHENTICATION / BIOMETRIC
  # ============================================================

  local_auth: ^2.3.0

  # ============================================================
  # HTTP
  # Used for GitHub Release API and APK download
  # ============================================================

  http: ^1.6.0

  # ============================================================
  # NOTIFICATIONS
  # ============================================================

  flutter_local_notifications: ^22.3.0

  # ============================================================
  # APP UPDATE
  # GitHub APK based update system
  # ============================================================

  package_info_plus: ^8.3.1
  open_filex: ^4.7.0


# ==============================================================
# DEV DEPENDENCIES
# ==============================================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ============================================================
  # APP LAUNCHER ICON
  # ==============================================================

  flutter_launcher_icons: ^0.14.4


# ==============================================================
# FLUTTER
# ==============================================================

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/excel/attendance_template.xlsx
    - assets/icon/app_icon.jpeg


# ==============================================================
# APP ICON CONFIGURATION
# ==============================================================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/app_icon.jpeg"

  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.jpeg"