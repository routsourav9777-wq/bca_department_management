name: bca_department_management
description: BCA Department Management System for Salipur Autonomous College
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  intl: ^0.20.2
  file_picker: ^10.3.2
  image_picker: ^1.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2

  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/